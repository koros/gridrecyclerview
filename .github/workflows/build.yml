name: Build

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" || sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: ./gradlew checkApi build publishReleasePublicationToMavenLocal --stacktrace

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_tag="${GITHUB_REF_NAME}"
          assets=(
            gridrecyclerview/build/outputs/aar/*.aar
            sampleapp/build/outputs/apk/debug/*.apk
            sampleapp/build/outputs/apk/release/*.apk
          )

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "${assets[@]}" --clobber
          else
            gh release create "$release_tag" "${assets[@]}" \
              --verify-tag \
              --title "$release_tag" \
              --generate-notes
          fi

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: gridrecyclerview-aar
          path: gridrecyclerview/build/outputs/aar/*.aar

      - name: Upload sample APKs
        uses: actions/upload-artifact@v4
        with:
          name: sampleapp-apks
          path: sampleapp/build/outputs/apk/**/*.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
